<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="wave" x2="25%" spreadMethod="reflect">
      <stop stop-color="white" />
      <stop offset="0.25" stop-color="white" stop-opacity="0.85355" />
      <stop offset="0.5" stop-color="white" stop-opacity="0.5" />
      <stop offset="0.75" stop-color="white" stop-opacity="0.14645" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="vertical" x2="0" y2="1">
      <stop stop-color="white" stop-opacity="0" />
      <stop offset="0.5" stop-color="white" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <rect id="x" width="64" height="64" fill="url(#wave)" />
    <rect id="y" width="64" height="64" fill="url(#vertical)" />
    <filter id="alpha" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feImage href="#x" result="x" />
      <feImage href="#y" result="y" />
      <feComposite in="x" in2="y" operator="arithmetic" k2="1.4" k3="2.5" k4="-1.55" />
    </filter>
  </defs>
  <rect width="64" height="64" filter="url(#alpha)" />
</svg>
