[package]
name = "pyxis-ad-astra"
version = "0.1.0"
description = "Starsector mod development tool"
authors = ["Delapsa-Lanterna"]
edition.workspace = true
rust-version.workspace = true

[workspace]
members = ["command-macros", "java-analysis"]
default-members = ["."]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
redundant_clone = "deny"
needless_collect = "deny"
inefficient_to_string = "deny"
assigning_clones = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"

[lints]
workspace = true

[workspace.dependencies]
tauri-build = "2.7.4"
command-macros = { path = "command-macros" }
pyxis-java-analysis = { path = "java-analysis" }
base64 = "0.23"
chrono = { version = "0.4", default-features = false }
csv = "1.3"
encoding_rs = "0.8"
itoa = "1"
zmij = "1"
serde = "1"
serde_json = "1"
tauri = "2.12.5"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-single-instance = "2.5.4"
thiserror = "2"
walkdir = "2.5"
notify = "8.2.1"
webview2-com = "0.39.1"
windows-core = "0.62"
windows-sys = "0.61"
reqwest = { version = "=0.13.5", default-features = false }
tokio = "=1.54.1"
sha2 = "=0.10.9"
zip = { version = "=9.4.2", default-features = false }
proc-macro2 = "1"
quote = "1"
syn = "2"

[lib]
name = "pyxis_ad_astra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[features]
default = ["performance-monitor"]
performance-monitor = []

[dependencies]
command-macros.workspace = true
pyxis-java-analysis.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["clock"] }
csv.workspace = true
encoding_rs.workspace = true
itoa.workspace = true
zmij.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-single-instance.workspace = true
thiserror.workspace = true
sha2.workspace = true
walkdir.workspace = true
notify.workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }

[target.'cfg(windows)'.dependencies]
webview2-com.workspace = true
windows-core.workspace = true
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

