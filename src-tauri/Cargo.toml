[package]
name = "pyxis-ad-astra"
version = "0.1.0"
description = "Starsector mod development tool"
authors = ["Delapsa-Lanterna"]
edition = "2024"
rust-version = "1.99.1"

[workspace]
members = ["command-macros"]

[lib]
name = "pyxis_ad_astra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[features]
default = ["performance-monitor"]
performance-monitor = []

[dependencies]
command-macros = { path = "command-macros" }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "1.3"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-single-instance = "2.5.4"
thiserror = "2"
walkdir = "2.5"

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

