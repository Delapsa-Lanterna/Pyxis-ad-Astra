<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>星界罗盘 - 论坛发布预览</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="workspace-header">
      <div class="workspace-heading">
        <p class="eyebrow">CIRCINUS AD ASTRA</p>
        <h1>星界罗盘 <span>论坛发布</span></h1>
      </div>
      <button id="copy-post" class="primary-button" type="button">复制帖子代码</button>
    </header>

    <main class="workspace">
      <section class="guide" aria-labelledby="guide-title">
        <div>
          <p class="eyebrow">RELEASE INFORMATION</p>
          <h2 id="guide-title">发布准备</h2>
          <p>复制帖子代码，在论坛编辑器中切换到 "纯文本" 模式并粘贴。版本、下载、反馈和截图请自行补充。</p>
          <p>将同目录的 hyperspace_bg_cool.jpg 上传到论坛，使用 "设置帖子背景颜色或图片" 工具设为背景。</p>
        </div>
        <div class="guide-aside">
          <span>建议标题</span>
          <strong>星界罗盘 | 远行星号 Mod 可视化编辑器</strong>
        </div>
      </section>

      <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>

      <section class="preview-frame" aria-labelledby="preview-title">
        <div class="frame-header">
          <h2 id="preview-title">帖子正文</h2>
          <span>本地预览 / 论坛显示效果可能不同</span>
        </div>
        <article id="post-preview" class="forum-post" aria-label="论坛帖子内容"></article>
      </section>

      <details class="source-panel">
        <summary>编辑帖子代码</summary>
        <div class="source-content">
          <p>这里的修改会更新预览和复制内容，关闭页面后不会自动保存。论坛附件和背景效果以论坛实际显示为准。</p>
          <label for="post-source">论坛帖子代码</label>
          <textarea id="post-source" spellcheck="false">
[table=98%,rgba(5,8,9,55%)]
[tr][td][align=center][color=#93a6ac][size=2]CIRCINUS AD ASTRA[/size][/color]
[color=#aadeff][size=5][b]星界罗盘[/b][/size][/color]
[color=#dcdcdc]Starsector Mod 可视化编辑器[/color][/align]

[color=#dcdcdc]为《远行星号》 Mod 创作者准备的 Windows 桌面工具。从船体布局到武器发射，在熟悉的界面中查看、调整与创作。[/color]

[hr]
[color=#aadeff][size=4][b]舰船编辑[/b][/size][/color]
[color=#ffd200]武器槽 / 引擎 / 护盾 / 边界[/color]
[color=#dcdcdc]在画布上直接调整舰船布局，配合镜像编辑、缩放与拖动，让每个位置都清晰可见。[/color]

[color=#93a6ac]舰船编辑截图：待补充[/color]

[hr]
[color=#aadeff][size=4][b]武器编辑与开火预览[/b][/size][/color]
[color=#ffd200]武器参数 / 弹体 / 发射效果[/color]
[color=#dcdcdc]编辑武器与关联弹体，在独立窗口中预览弹体和光束的发射过程。支持暂停、逐帧查看、调整速度与切换挂载视图。[/color]

[color=#93a6ac]武器编辑和开火预览截图：待补充[/color]

[hr]
[color=#aadeff][size=4][b]原版风格的编辑界面[/b][/size][/color]
[color=#dcdcdc]在熟悉的舰船和武器信息界面中查看与修改数据，让创作过程更直观。[/color]

[color=#93a6ac]原版风格界面截图：待补充[/color]

[hr]
[color=#aadeff][size=4][b]工作区与文件[/b][/size][/color]
[color=#dcdcdc]打开游戏目录或独立 Mod 目录，在工作区切换多个 Mod；编辑已支持的表格、配置和文本文件，浏览资源，通过文件历史撤销或重做已保存的修改。[/color]

[hr]
[color=#aadeff][size=4][b]开始使用[/b][/size][/color]
[color=#dcdcdc]1. 在 Windows 上运行编辑器。
2. 选择《远行星号》游戏目录，或直接打开一个 Mod 目录。
3. 从 Mod 页签进入工作区，选择需要编辑的内容。

修改 Mod 前建议先备份原文件。[/color]

[hr]
[color=#aadeff][size=4][b]获取与反馈[/b][/size][/color]
[color=#dcdcdc]版本：待填写
下载：待填写
反馈：待填写[/color][/td][/tr]
[/table]</textarea>
        </div>
      </details>
    </main>
  </body>
</html>
