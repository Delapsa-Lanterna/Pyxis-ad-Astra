name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java-analysis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Read Java runtime requirement
        id: java-runtime
        run: node -e "const fs=require('node:fs');const versions=require('./src-tauri/java-analysis/versions.json');fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+versions.java+'\n')"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java-runtime.outputs.version }}
      - name: Read Rust toolchain
        id: rust-toolchain
        shell: pwsh
        run: |
          $rustToolchainVersion = (Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel = "([^"]+)"$').Matches[0].Groups[1].Value
          "version=$rustToolchainVersion" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run build:java-analysis
      - run: npm run check:java-analysis
      - name: Test live Java runtime lifecycle
        shell: pwsh
        run: |
          $env:JAVA_ANALYSIS_TEST_JAVA = Join-Path $env:JAVA_HOME 'bin/java.exe'
          cargo test --manifest-path src-tauri/Cargo.toml -p pyxis-java-analysis --test runtime -- --include-ignored
      - name: Test application Java analysis infrastructure
        shell: pwsh
        run: |
          $env:JAVA_ANALYSIS_TEST_JAVA = Join-Path $env:JAVA_HOME 'bin/java.exe'
          cargo test --manifest-path src-tauri/Cargo.toml -p pyxis-ad-astra services::java_analysis::tests::live_adapter_routes_configuration_diagnostics_and_shutdown -- --exact --ignored
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Read Rust toolchain
        id: rust-toolchain
        shell: pwsh
        run: |
          $rustToolchainVersion = (Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel = "([^"]+)"$').Matches[0].Groups[1].Value
          "version=$rustToolchainVersion" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: ESLint full check
        run: npm run lint:full

      - name: Architecture, styles, identifier length and encoding checks
        run: npm run lint:checks

      - name: Typecheck
        run: npm run typecheck

      - name: Checker tests
        run: npm run test:checks

      - name: Test file resource lifecycle
        run: npm run test:resources

      - name: Frontend tests
        run: npm run test --reporter=default

      - name: Rust clippy
        run: npm run lint:rust

      - name: Rust tests (long paths)
        run: ./scripts/test-rust-paths.ps1 -PathForm Long

      - name: Rust tests (8.3 short paths)
        run: ./scripts/test-rust-paths.ps1 -PathForm Short

      - name: Rust tests (paths beyond 260 characters)
        run: ./scripts/test-rust-paths.ps1 -PathForm Beyond260

      - name: Tauri build and version alignment
        run: npm run tauri -- build --no-bundle
