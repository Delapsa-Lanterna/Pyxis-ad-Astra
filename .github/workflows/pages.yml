name: Browser demo
run-name: Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  deployments: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run build:demo -- --base '${{ steps.pages.outputs.base_path }}/'
      - run: npx playwright install --with-deps chromium
      - name: Serve demo artifact
        run: node scripts/browser/serve.mjs browser --production --existing --directory dist/browser-demo --base /Pyxis-ad-Astra/ --port 1463 &
      - name: Verify demo artifact
        run: node scripts/browser/demo.mjs http://127.0.0.1:1463/Pyxis-ad-Astra/
      - name: Remove previous artifacts
        id: artifact_cleanup
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.runId,
            });
            for (const artifact of artifacts) {
              if (["github-pages", "demo-verification"].includes(artifact.name)) {
                await github.rest.actions.deleteArtifact({
                  ...context.repo,
                  artifact_id: artifact.id,
                });
              }
            }
      - uses: actions/upload-artifact@v4
        if: always() && steps.artifact_cleanup.outcome == 'success'
        with:
          name: demo-verification
          path: node_modules/.cache/browser/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/browser-demo
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Remove previous deployments
        uses: actions/github-script@v7
        with:
          script: |
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo,
              environment: "github-pages",
              per_page: 100,
            });
            deployments.sort((left, right) => right.id - left.id);
            for (const deployment of deployments.slice(1)) {
              await github.rest.repos.createDeploymentStatus({
                ...context.repo,
                deployment_id: deployment.id,
                state: "inactive",
              });
              await github.rest.repos.deleteDeployment({
                ...context.repo,
                deployment_id: deployment.id,
              });
            }
